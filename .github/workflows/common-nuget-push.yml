name: Build and push

on:
  workflow_call:
    secrets:
      NUGETAPI:
        required: true
      NUGETUSER:
        required: true
      DW_TOKEN_API:
        required: false
env:
  dwRepo: ${{ github.event.repository.name }}
  GH_TOKEN: ${{secrets.DW_TOKEN_API}}
  
jobs:
  build-and-publish:
    permissions:
      actions: write
      checks: write
      contents: read
      pull-requests: write
      statuses: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 9.0.x
    - name: Build
      run: dotnet build
    - name: Test
      run: dotnet test --no-build --verbosity normal
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGETUSER }}
    
